# Railway configuration — Celery worker (local queue)
# In Railway dashboard: set Root Directory to / (repo root)
# Build: Custom Dockerfile → backend/Dockerfile, Target: production

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
dockerTarget = "production"

[deploy]
startCommand = "celery -A app.workers.celery_app worker -Q local -c 2 --loglevel=info"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envs]
RUN_MIGRATIONS = "false"
ENVIRONMENT = "production"
