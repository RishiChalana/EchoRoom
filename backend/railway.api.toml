# Railway configuration — API service
# In Railway dashboard: set Root Directory to / (repo root)
# Build: Custom Dockerfile → backend/Dockerfile, Target: production

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
dockerTarget = "production"

[deploy]
startCommand = "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envs]
RUN_MIGRATIONS = "true"
ENVIRONMENT = "production"
