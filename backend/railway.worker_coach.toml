# Railway configuration — Celery worker (coach queue, LangGraph)
# In Railway dashboard: set Root Directory to / (repo root)
# Build: Custom Dockerfile → backend/Dockerfile, Target: production
# Single concurrency — LangGraph graph is not thread-safe.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
dockerTarget = "production"

[deploy]
startCommand = "celery -A app.workers.celery_app worker -Q coach -c 1 --loglevel=info"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.envs]
RUN_MIGRATIONS = "false"
ENVIRONMENT = "production"
