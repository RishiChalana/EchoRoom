# ─────────────────────────────────────────────────────────────────────────────
# EchoRoom — Local Development Compose
# Usage: docker compose up
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: echoroom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echoroom
      POSTGRES_USER: echoroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-echoroom_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoroom -d echoroom"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - echoroom_net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: echoroom_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - echoroom_net

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: echoroom_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoroom:${POSTGRES_PASSWORD:-echoroom_dev_pass}@postgres:5432/echoroom
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - echoroom_net

  # ── Celery Worker (local + llm queues) ───────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: echoroom_worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q local,llm -c 4
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoroom:${POSTGRES_PASSWORD:-echoroom_dev_pass}@postgres:5432/echoroom
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - echoroom_net

  # ── Celery Worker (coach queue — single concurrency for LangGraph) ────────────
  worker_coach:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: echoroom_worker_coach
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info -Q coach -c 1
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echoroom:${POSTGRES_PASSWORD:-echoroom_dev_pass}@postgres:5432/echoroom
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - echoroom_net

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: echoroom_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - echoroom_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local
  frontend_next:
    driver: local

networks:
  echoroom_net:
    driver: bridge
    name: echoroom_network
